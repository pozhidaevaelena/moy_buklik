<script>

// ==================== АНИМАЦИИ БУКЛИКА ====================
function setBuklikEmotion(emotion) {
    buklikImg.classList.remove('animate-happy', 'animate-thinking', 'animate-sad', 'animate-listening');
    buklikImg.classList.add('animate-float');
    switch(emotion) {
        case 'happy':
            buklikImg.classList.add('animate-happy');
            setTimeout(() => buklikImg.classList.add('animate-float'), 600);
            break;
        case 'thinking':
            buklikImg.classList.add('animate-thinking');
            break;
        case 'sad':
            buklikImg.classList.add('animate-sad');
            setTimeout(() => buklikImg.classList.add('animate-float'), 800);
            break;
        case 'listening':
            buklikImg.classList.add('animate-listening');
            setTimeout(() => buklikImg.classList.add('animate-float'), 500);
            break;
        default:
            buklikImg.classList.add('animate-float');
    }
}

// ==================== ГОЛОС ====================
let speechSynth = window.speechSynthesis;
let voices = [];

function loadVoices() {
    voices = speechSynth.getVoices();
}
loadVoices();
if (speechSynth.onvoiceschanged !== undefined) {
    speechSynth.onvoiceschanged = loadVoices;
}

function speakText(text) {
    if (!voiceEnabled || !text) return;
    speechSynth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 0.9;
    utterance.pitch = 1.2;
    const ruVoice = voices.find(v => v.lang === 'ru-RU' && (v.name.includes('Google') || v.name.includes('Microsoft')));
    if (ruVoice) utterance.voice = ruVoice;
    speechSynth.speak(utterance);
}

function enableVoice() {
    if (!voiceEnabled) {
        voiceEnabled = true;
        voiceToggle.textContent = '🔊 Голос Буклика включён';
        voiceToggle.style.background = '#4CAF50';
        voiceToggle.style.color = 'white';
        setTimeout(() => {
            setBuklikEmotion('happy');
            speakText('Привет! Я Буклик, рад тебя слышать!');
        }, 500);
    }
}
voiceToggle.onclick = enableVoice;

// ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
function addMessage(text, isUser = false) {
    const msg = document.createElement('div');
    msg.className = `message ${isUser ? 'user' : 'bot'}`;
    msg.innerHTML = `<strong>${isUser ? 'Ты' : 'Буклик'}:</strong> ${text}`;
    chatDiv.appendChild(msg);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    if (!isUser && voiceEnabled) {
        speakText(text);
    }
}

function showSuggestions(options) {
    suggestionsDiv.innerHTML = '';
    const customBtn = document.createElement('span');
    customBtn.className = 'suggestion-btn';
    customBtn.textContent = '✏️ Придумать свой вариант';
    customBtn.onclick = () => {
        userInput.placeholder = 'Напиши, что будет дальше...';
        userInput.focus();
        setBuklikEmotion('thinking');
    };
    suggestionsDiv.appendChild(customBtn);
    options.forEach(opt => {
        const btn = document.createElement('span');
        btn.className = 'suggestion-btn';
        btn.textContent = opt;
        btn.onclick = () => {
            userInput.value = opt;
            sendBtn.click();
        };
        suggestionsDiv.appendChild(btn);
    });
}

function clearSuggestions() { suggestionsDiv.innerHTML = ''; }

function detectGender(name) {
    const lowerName = name.toLowerCase();
    if (maleNames.includes(lowerName)) return 'boy';
    if (femaleNames.includes(lowerName)) return 'girl';
    return null;

// ==================== ЗАПРОСЫ К OPENROUTER ====================
async function askOpenRouter(prompt, isFirstParagraph = false) {
    try {
        let systemPrompt = `Ты детский писатель. Ты пишешь ВОЛШЕБНЫЕ СКАЗКИ для детей 7 лет.
        ВАЖНО: Согласуй все слова по падежам и роду! Если герой женского рода — используй окончания "а", "я", "ла", "ла". Если герой мужского рода — окончания "л", "ел", "ыл".
        Не используй звёздочки, markdown, кавычки-ёлочки.
        Пиши ярко, образно, интересно для ребёнка.`;
        
        if (isFirstParagraph) {
            systemPrompt += `\n\nВАЖНО: НЕ НАЧИНАЙ СКАЗКУ СО СЛОВ "Жил-был" или "Жила-была". Придумай разные, интересные начала: "В далёкой стране...", "Однажды утром...", "В волшебном лесу...", "За семью горами...", "В одном удивительном королевстве...".`;
        }
        
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "qwen/qwen-3.6-plus-preview:free",
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: prompt }
                ],
                temperature: 0.85,
                max_tokens: 500
            })
        });
        const data = await response.json();
        if (data.choices && data.choices[0]) {
            return data.choices[0].message.content.trim();
        }
        return null;
    } catch(e) {
        console.error('OpenRouter error:', e);
        return null;
    }
}

// ==================== ГЕНЕРАЦИЯ ТЕКСТА ====================
async function generateFirstParagraph() {
    setBuklikEmotion('thinking');
    addMessage('✨ Сейчас придумаю начало сказки...');
    
    const heroText = hero;
    const genderHint = (hero.includes('фея') || hero.includes('принцесса') || hero.includes('девочка')) 
        ? ' (герой женского рода, используй "она", "её", окончания "а", "я")' 
        : ' (герой мужского рода, используй "он", "его", окончания "л", "ел")';
    
    const prompt = `Напиши первый абзац волшебной сказки для ребёнка 7 лет.
        Герой: ${heroText}${genderHint}
        Место: ${place}. 
        Друг: ${friend}. 
        Напиши 3-4 предложения.
        НЕ НАЧИНАЙ СО СЛОВ "Жил-был" или "Жила-была". Придумай интересное начало.
        ВАЖНО: Согласуй все слова по падежам правильно.`;
    
    const paragraph = await askOpenRouter(prompt, true);
    
    if (paragraph && paragraph.length > 20) {
        fullStory.push(paragraph);
        fullImagePrompts.push(`${heroText} и ${friend} в ${place}, волшебная сказка, детская иллюстрация`);
        storyBlock.textContent = paragraph;
        addMessage(paragraph);
        setBuklikEmotion('happy');
        return true;
    } else {
        const fallback = (hero.includes('фея') || hero.includes('принцесса') || hero.includes('девочка'))
            ? `В волшебном ${place} жила-была ${heroText}. Однажды она встретила ${friend}. Это была удивительная встреча!`
            : `В далёком ${place} жил-был ${heroText}. Однажды он встретил ${friend}. Начались настоящие чудеса!`;
        fullStory.push(fallback);
        fullImagePrompts.push(`${heroText} и ${friend} в ${place}`);
        storyBlock.textContent = fallback;
        addMessage(fallback);
        return true;
    }
}

    const heroText = hero;
    const prompt = `Напиши счастливый конец сказки про ${heroText} и ${friend}.

    if (paragraph && paragraph.length > 20) {

// ==================== КАРТИНКИ ====================
async function generatePicture(prompt, index) {
    pictureBlock.style.display = 'block';
    if (index === currentParagraph - 1) {
        pictureImg.src = '';
        const imgDiv = pictureBlock.querySelector('div');
        if (imgDiv) imgDiv.textContent = '🎨 Рисую картинку...';
        try {
            const encodedPrompt = encodeURIComponent(prompt.slice(0, 150));
            const response = await fetch(`${API_URL}/generate-image?prompt=${encodedPrompt}`);
            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                pictureImg.src = url;
                fullImages[index] = url;
                if (imgDiv) imgDiv.textContent = '✨ Вот картинка к твоей истории!';
                setBuklikEmotion('happy');
            } else throw new Error('Ошибка');
        } catch (error) {
            console.error('Ошибка картинки:', error);
            if (imgDiv) imgDiv.textContent = '😔 Картинка не загрузилась, но ты молодец!';
        }
    }
}

// ==================== ПРОВЕРКА ЧТЕНИЯ ====================
function startListening() {
    if (!recognition) {
        if (!('webkitSpeechRecognition' in window)) {
            addMessage('Твой браузер не поддерживает микрофон. Попробуй Chrome!');
            return;
        }
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = false;
        recognition.interimResults = false;
    }
    micBtn.classList.add('listening');
    micBtn.textContent = '🎤 Слушаю...';
    setBuklikEmotion('listening');
    addMessage('🎙️ Слушаю тебя! Прочитай этот абзац вслух.');
    
    recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤 Микрофон';
        addMessage(spokenText, true);
        recognition.stop();
        checkReading(spokenText);
    };
    
    recognition.onerror = () => {
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤 Микрофон';
        setBuklikEmotion('sad');
        addMessage('😊 Не расслышал. Попробуй ещё раз, нажми на микрофон и читай громче!');
        recognition.stop();
    };

function checkReading(spokenText) {
    const cleanExpected = expectedText.toLowerCase().replace(/[^\w\s]/g, '');
    const cleanSpoken = spokenText.toLowerCase().replace(/[^\w\s]/g, '');
    let matches = 0;
    const expectedWords = cleanExpected.split(/\s+/);
    const spokenWords = cleanSpoken.split(/\s+/);
    for (let word of spokenWords) {
        if (expectedWords.some(w => w.includes(word) || word.includes(w))) matches++;
    }
    const matchPercent = matches / expectedWords.length;
    
    if (matchPercent > 0.3 || cleanSpoken.length > cleanExpected.length * 0.3) {
        setBuklikEmotion('happy');
        addMessage('🎉 Отлично! Ты замечательно прочитал(а)! Молодец!');
        generatePicture(fullImagePrompts[currentParagraph - 1], currentParagraph - 1);
        
        // Проверяем, закончена ли сказка
        if (currentParagraph >= fullStory.length) {
            addMessage('📚 Ура! Ты прочитал(а) всю сказку! Теперь можешь скачать книгу со всеми картинками.');
            downloadBtn.style.display = 'block';
            step = 99;
            isReadingMode = false;
        } else {
            addMessage('✨ Что будет дальше в сказке? Придумай свой вариант или выбери.');
            showSuggestions([
                'нашли волшебный клад', 
                'встретили доброго волшебника', 
                'спасли друга из беды', 
                'полетели на ковре-самолёте', 
                'попали в заколдованный лес'
            ]);
            isWaitingForIdea = true;
            step = 6;
        }
    } else {
        setBuklikEmotion('sad');
        addMessage('😊 Почти получилось! Давай попробуем ещё раз. Нажми на микрофон и прочитай внимательно.');
    }
}
