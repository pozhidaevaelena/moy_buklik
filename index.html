<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Буклик — волшебный друг ✨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif; }
        body {
            background: linear-gradient(145deg, #7BC5AE 0%, #B8E1D9 50%, #E6C5A8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 248, 235, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 70px 70px 50px 50px;
            padding: 30px 25px 40px;
            box-shadow: 0 30px 50px rgba(92,55,20,0.3);
            border: 3px solid rgba(255,250,220,0.9);
            text-align: center;
        }
        h1 {
            font-size: 2.8rem;
            color: #3F2B1C;
            text-shadow: 4px 4px 0 #F9D77E;
            background: #FFF5E0;
            display: inline-block;
            padding: 12px 35px;
            border-radius: 90px;
            margin-bottom: 20px;
            border: 4px solid #FFCF9A;
        }
        .character-img {
            max-width: 200px;
            border-radius: 50px;
            border: 5px solid #FFEAC1;
            filter: drop-shadow(0 15px 20px rgba(110,70,20,0.2));
            animation: float 4s ease-in-out infinite;
            margin: 10px auto 20px;
            cursor: pointer;
        }
        @keyframes float { 50% { transform: translateY(-10px); } }
        .mission {
            background: rgba(255, 245, 215, 0.8);
            backdrop-filter: blur(2px);
            border-radius: 60px;
            padding: 18px 20px;
            margin: 0 10px 25px;
            border: 3px dashed #F1C78C;
            font-size: 1.3rem;
            color: #1F4E3D;
            line-height: 1.6;
        }
        .story-block {
            background: #FFF9E6;
            border-radius: 40px;
            padding: 25px;
            margin: 20px 0;
            border: 4px solid #FFB27F;
            font-size: 1.5rem;
            line-height: 1.8;
            color: #2B1404;
            box-shadow: inset 0 0 15px #FFEAC1;
            text-align: left;
        }
        .picture-block {
            background: #FFD9C0;
            border-radius: 30px;
            padding: 20px;
            margin: 15px 0;
            border: 4px dashed #FFB27F;
            display: none;
            text-align: center;
        }
        .picture-block img {
            max-width: 100%;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .chat {
            background: rgba(255,255,240,0.9);
            border-radius: 30px;
            padding: 20px;
            height: 250px;
            overflow-y: auto;
            border: 3px solid #FFCF9A;
            margin: 20px 0;
            text-align: left;
            font-size: 1.2rem;
        }
        .message { margin: 10px 0; }
        .message.user { text-align: right; color: #2B1404; }
        .message.bot { text-align: left; color: #1F4E3D; }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 40px;
            border: 3px solid #FFCF9A;
            outline: none;
        }
        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            border-radius: 40px;
            border: 3px solid #FFEAA2;
            background: #FFB27F;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
            box-shadow: 0 4px 0 #A65629;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 #A65629; }
        .mic { background: #A7D0CD; }
        .listening {
            background: #4CAF50;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); background: #45a049; }
            100% { transform: scale(1); }
        }
        .suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
            justify-content: center;
        }
        .suggestion-btn {
            background: #FFF0D9;
            border: 2px solid #FFB27F;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .suggestion-btn:hover { background: #FFB27F; color: white; }
        #download-btn {
            background: #D9B8C4;
            margin: 20px auto 0;
            display: none;
            padding: 15px 30px;
            border-radius: 60px;
            border: 4px solid #FFB27F;
            cursor: pointer;
            width: fit-content;
            font-weight: bold;
        }
        @media (max-width: 550px) {
            h1 { font-size: 2.2rem; }
            .mission { font-size: 1.1rem; }
            .story-block { font-size: 1.3rem; }
            button { padding: 12px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <h1>✨ Привет, я Буклик ✨</h1>
    <div class="mission">
        Я помогаю придумывать волшебные истории,<br>
        читать вслух и рисовать картинки!
    </div>
    <img src="moy_buklik.jpg" alt="Буклик" class="character-img" id="buklikImg">

    <div class="story-block" id="storyBlock">📖 Здесь появится твоя история...</div>
    <div class="picture-block" id="pictureBlock">
        <div>🎨 Волшебная картинка создаётся...</div>
        <img id="pictureImg" src="" alt="Иллюстрация">
    </div>
    <div class="chat" id="chat"></div>
    
    <div class="suggestions" id="suggestions"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Напиши или нажми микрофон">
        <button id="sendBtn">📬 Отправить</button>
        <button id="micBtn" class="mic">🎤 Микрофон</button>
    </div>

    <div id="download-btn">📥 Скачать книгу</div>
</div>

<script>
    (function() {
        const API_URL = 'https://examples-beta-murex.vercel.app';

        const chat = document.getElementById('chat');
        const storyBlock = document.getElementById('storyBlock');
        const pictureBlock = document.getElementById('pictureBlock');
        const pictureImg = document.getElementById('pictureImg');
        const buklikImg = document.getElementById('buklikImg');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const downloadBtn = document.getElementById('download-btn');
        const suggestionsDiv = document.getElementById('suggestions');

        let step = 0;
        let childName = '';
        let childGender = '';
        let hero = '', place = '', friend = '';
        let fullStory = [];
        let fullImages = [];
        let fullImagePrompts = [];
        let currentParagraph = 0;
        let conversationHistory = [];
        let expectedText = '';
        let recognition = null;

        // Голос
        let voiceEnabled = true;
        let speechSynth = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = speechSynth.getVoices();
        }
        loadVoices();
        if (speechSynth.onvoiceschanged !== undefined) {
            speechSynth.onvoiceschanged = loadVoices;
        }

        function speakText(text) {
            if (!voiceEnabled) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            const ruVoice = voices.find(v => v.lang === 'ru-RU');
            if (ruVoice) utterance.voice = ruVoice;
            speechSynth.cancel();
            speechSynth.speak(utterance);
        }

        const maleNames = ['александр', 'алексей', 'андрей', 'антон', 'артём', 'борис', 'вадим', 'валентин', 'валерий', 'василий', 'виктор', 'владимир', 'владислав', 'вячеслав', 'геннадий', 'георгий', 'герман', 'глеб', 'григорий', 'даниил', 'денис', 'дмитрий', 'евгений', 'егор', 'иван', 'игорь', 'илья', 'кирилл', 'константин', 'лев', 'леонид', 'максим', 'марк', 'матвей', 'михаил', 'никита', 'николай', 'олег', 'павел', 'пётр', 'платон', 'родион', 'роман', 'руслан', 'савва', 'святослав', 'семён', 'сергей', 'станислав', 'степан', 'тимофей', 'тимур', 'фёдор', 'филипп', 'юрий', 'яков', 'ярослав'];
        const femaleNames = ['александра', 'алина', 'алиса', 'алла', 'анастасия', 'ангелина', 'анна', 'антонина', 'валентина', 'валерия', 'варвара', 'вера', 'вероника', 'виктория', 'галина', 'дарина', 'дарья', 'диана', 'ева', 'евгения', 'екатерина', 'елена', 'елизавета', 'жанна', 'зинаида', 'зоя', 'инна', 'ирина', 'карина', 'кира', 'клавдия', 'ксения', 'лада', 'лариса', 'лидия', 'лилия', 'любовь', 'людмила', 'майя', 'маргарита', 'марина', 'мария', 'милена', 'надежда', 'настасья', 'наталья', 'нелли', 'нина', 'оксана', 'оливия', 'ольга', 'полина', 'раиса', 'рита', 'светлана', 'софия', 'софья', 'таисия', 'тамара', 'татьяна', 'ульяна', 'юлия'];
        
        function detectGender(name) {
            const lowerName = name.toLowerCase();
            if (maleNames.includes(lowerName)) return 'boy';
            if (femaleNames.includes(lowerName)) return 'girl';
            return null;
        }

        function addMessage(sender, text) {
            const msg = document.createElement('div');
            msg.className = `message ${sender === 'Буклик' ? 'bot' : 'user'}`;
            msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            if (sender === 'Буклик') speakText(text);
        }

        function showSuggestions(options) {
            suggestionsDiv.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('span');
                btn.className = 'suggestion-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    userInput.value = opt;
                    sendBtn.click();
                };
                suggestionsDiv.appendChild(btn);
            });
        }

        function clearSuggestions() { suggestionsDiv.innerHTML = ''; }

        async function callYandexGPT(prompt, system) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: prompt,
                        history: conversationHistory,
                        system: system
                    })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                let text = data.reply;
                if (!text || text === '...') return null;
                if (data.history) conversationHistory = data.history;
                return text;
            } catch (error) {
                console.error('Ошибка YandexGPT:', error);
                return null;
            }
        }

        async function generatePicture(prompt) {
            pictureBlock.style.display = 'block';
            pictureImg.src = '';
            const imgDiv = pictureBlock.querySelector('div');
            if (imgDiv) imgDiv.innerText = '🎨 Волшебная картинка создаётся...';

            try {
                const encodedPrompt = encodeURIComponent(prompt.slice(0, 100));
                const response = await fetch(`${API_URL}/generate-image?prompt=${encodedPrompt}`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    pictureImg.src = url;
                    fullImages.push(url);
                    if (imgDiv) imgDiv.innerText = '✨ Вот картинка к твоей истории:';
                } else {
                    throw new Error('Ошибка');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                if (imgDiv) imgDiv.innerText = '😔 Картинка не загрузилась, но ты молодец!';
            }
        }

        // Функция для генерации ОДНОГО абзаца
        async function generateOneParagraph(isFirst, userIdea = '') {
            let prompt = '';
            if (isFirst) {
                prompt = `Напиши первый абзац волшебной сказки для ребёнка 7 лет.
                    Главный герой: ${hero}. 
                    Место действия: ${place}. 
                    Друг героя: ${friend}. 
                    Напиши 3-4 предложения. Начни со слов "Жил-был" или "Жила-была".
                    Не пиши "конец" или "финал". Просто начало.`;
            } else {
                prompt = `Продолжи сказку про ${hero} и ${friend}. 
                    Ребёнок придумал: "${userIdea}".
                    Напиши следующий абзац (3-4 предложения). Развивай сюжет.
                    Не заканчивай сказку, если это не финал.`;
            }
            
            addMessage('Буклик', '✨ Сейчас придумаю...');
            const paragraph = await callYandexGPT(prompt, 'Ты — детский писатель. Пиши красиво, грамотно, с волшебством. Только текст, без звёздочек.');
            
            if (!paragraph) {
                if (isFirst) {
                    return `Жил-был ${hero} в ${place}. Однажды ${hero} встретил ${friend}. И началось у них волшебное приключение!`;
                } else {
                    return `И отправились ${hero} и ${friend} дальше, навстречу новым чудесам!`;
                }
            }
            return paragraph;
        }

        async function generateFinalParagraph() {
            const prompt = `Напиши счастливый конец сказки про ${hero} и ${friend}. 
                Они возвращаются домой, всё хорошо. 3-4 предложения, тепло, волшебно.
                Закончи словами "И жили они долго и счастливо".`;
            
            addMessage('Буклик', '✨ Придумываю финал...');
            const paragraph = await callYandexGPT(prompt, 'Ты — детский писатель. Напиши тёплый финал.');
            
            if (!paragraph) {
                return `И вернулись ${hero} и ${friend} домой. Все были счастливы. И жили они долго и счастливо!`;
            }
            return paragraph;
        }

        function startListening() {
            if (!recognition) {
                if (!('webkitSpeechRecognition' in window)) {
                    addMessage('Буклик', 'Твой браузер не поддерживает микрофон. Попробуй Chrome!');
                    return;
                }
                recognition = new webkitSpeechRecognition();
                recognition.lang = 'ru-RU';
                recognition.continuous = false;
                recognition.interimResults = false;
            }
            
            micBtn.classList.add('listening');
            micBtn.textContent = '🎤 Слушаю...';
            addMessage('Буклик', '🎙️ Я слушаю! Прочитай, пожалуйста, этот абзац вслух.');
            
            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript.toLowerCase();
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤 Микрофон';
                addMessage('Ты', spokenText);
                checkReading(spokenText);
            };
            
            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤 Микрофон';
                addMessage('Буклик', 'Не расслышал. Попробуй ещё раз, нажми на микрофон и прочитай громче!');
            };
            
            recognition.start();
        }

        function checkReading(spokenText) {
            const cleanExpected = expectedText.toLowerCase().replace(/[^\w\s]/g, '');
            const cleanSpoken = spokenText.replace(/[^\w\s]/g, '');
            
            const expectedWords = cleanExpected.split(/\s+/);
            const spokenWords = cleanSpoken.split(/\s+/);
            let matches = 0;
            for (let word of spokenWords) {
                if (expectedWords.some(w => w.includes(word) || word.includes(w))) {
                    matches++;
                }
            }
            const matchPercent = matches / expectedWords.length;
            
            if (matchPercent > 0.3 || cleanSpoken.length > cleanExpected.length * 0.3) {
                addMessage('Буклик', '🎉 Отлично! Ты замечательно прочитал(а)! Молодец!');
                // Рисуем картинку
                const imgPrompt = expectedText.slice(0, 80) + ", волшебная сказка, иллюстрация для детей";
                generatePicture(imgPrompt);
                // Переходим к выбору продолжения
                setTimeout(() => {
                    if (currentParagraph + 1 >= 3) {
                        // Это был 3й абзац, пора заканчивать
                        continueToFinal();
                    } else {
                        askForNextIdea();
                    }
                }, 2000);
            } else {
                addMessage('Буклик', '😊 Почти получилось! Давай попробуем ещё раз. Нажми на микрофон и прочитай внимательно.');
            }
        }

        async function continueToFinal() {
            const finalParagraph = await generateFinalParagraph();
            fullStory.push(finalParagraph);
            fullImagePrompts.push(finalParagraph.slice(0, 80));
            storyBlock.textContent = finalParagraph;
            expectedText = finalParagraph;
            addMessage('Буклик', '📖 Вот финал твоей сказки:');
            addMessage('Буклик', finalParagraph);
            addMessage('Буклик', '🎤 Прочитай финал вслух!');
            currentParagraph = fullStory.length - 1;
            step = 8;
        }

        function askForNextIdea() {
            addMessage('Буклик', '✨ Что будет дальше в сказке? Ты можешь выбрать или придумать свой вариант.');
            showSuggestions(['нашли клад', 'встретили волшебника', 'попали в подземелье', 'спасли друга', 'полетели на ковре-самолёте', 'придумаю сам(а)']);
            step = 6;
        }

        // НАЧАЛО
        addMessage('Буклик', 'Привет! Я Буклик 🤗');
        addMessage('Буклик', 'Как тебя зовут?');

        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            addMessage('Ты', text);
            clearSuggestions();

            try {
                if (step === 0) {
                    childName = text;
                    const detected = detectGender(childName);
                    if (detected) {
                        childGender = detected;
                        addMessage('Буклик', `Приятно познакомиться, ${childName}!`);
                        addMessage('Буклик', 'Кто будет главным героем?');
                        showSuggestions(['я', 'фея', 'дракон', 'принцесса', 'котёнок', 'волшебник', 'единорог']);
                        step = 2;
                    } else {
                        addMessage('Буклик', `Приятно познакомиться, ${childName}! Ты мальчик или девочка?`);
                        showSuggestions(['мальчик', 'девочка']);
                        step = 1;
                    }
                }
                else if (step === 1) {
                    childGender = text.includes('мальчик') ? 'boy' : 'girl';
                    addMessage('Буклик', 'Кто будет главным героем?');
                    showSuggestions(['я', 'фея', 'дракон', 'принцесса', 'котёнок', 'волшебник', 'единорог']);
                    step = 2;
                }
                else if (step === 2) {
                    const lower = text.toLowerCase().trim();
                    if (lower === 'я' || lower === 'я сама' || lower === 'я сам') {
                        hero = childGender === 'boy' ? `мальчик ${childName}` : `девочка ${childName}`;
                    } else {
                        hero = text;
                    }
                    addMessage('Буклик', 'Где происходит действие?');
                    showSuggestions(['в волшебном лесу', 'в замке', 'в космосе', 'на острове', 'под водой', 'в облаках']);
                    step = 3;
                }
                else if (step === 3) {
                    place = text;
                    addMessage('Буклик', 'Кто друг героя?');
                    showSuggestions(['лисёнок', 'дракончик', 'фея', 'говорящий кот', 'мудрая сова', 'весёлый робот']);
                    step = 4;
                }
                else if (step === 4) {
                    friend = text;
                    
                    // Генерируем ПЕРВЫЙ абзац
                    const firstParagraph = await generateOneParagraph(true);
                    fullStory = [firstParagraph];
                    fullImagePrompts = [firstParagraph.slice(0, 80)];
                    storyBlock.textContent = firstParagraph;
                    expectedText = firstParagraph;
                    currentParagraph = 0;
                    
                    addMessage('Буклик', '📖 Вот начало твоей сказки:');
                    addMessage('Буклик', firstParagraph);
                    addMessage('Буклик', '🎤 Теперь прочитай этот абзац вслух! Нажми на кнопку с микрофоном и читай.');
                    step = 5;
                }
                else if (step === 5) {
                    addMessage('Буклик', 'Нажми на синюю кнопку с микрофоном 🎤 и прочитай текст вслух!');
                }
                else if (step === 6) {
                    // Ребёнок придумал продолжение
                    const nextParagraph = await generateOneParagraph(false, text);
                    fullStory.push(nextParagraph);
                    fullImagePrompts.push(nextParagraph.slice(0, 80));
                    storyBlock.textContent = nextParagraph;
                    expectedText = nextParagraph;
                    currentParagraph = fullStory.length - 1;
                    
                    addMessage('Буклик', '📖 Вот продолжение:');
                    addMessage('Буклик', nextParagraph);
                    addMessage('Буклик', '🎤 Прочитай этот абзац вслух!');
                    step = 5;
                }
                else if (step === 8) {
                    // После финала
                    if (text.toLowerCase().includes('да') || text.toLowerCase().includes('хочу')) {
                        addMessage('Буклик', 'Отлично! Сейчас я соберу твою книгу. Нажми на кнопку "Скачать книгу" внизу.');
                        downloadBtn.style.display = 'inline-block';
                    } else {
                        addMessage('Буклик', 'Хорошо! В любое время можешь скачать книгу. Приходи ещё, придумаем новую сказку!');
                        downloadBtn.style.display = 'inline-block';
                    }
                    step = 9;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                addMessage('Буклик', 'Что-то пошло не так. Давай попробуем ещё раз.');
            }
        };

        // Микрофон
        micBtn.onclick = () => {
            if (step === 5 && expectedText) {
                startListening();
            } else if (step === 8 && expectedText) {
                startListening();
            } else {
                // Обычная диктовка
                if ('webkitSpeechRecognition' in window) {
                    const rec = new webkitSpeechRecognition();
                    rec.lang = 'ru-RU';
                    rec.onresult = (e) => {
                        userInput.value = e.results[0][0].transcript;
                        sendBtn.click();
                    };
                    rec.start();
                }
            }
        };

        // Скачивание PDF
        downloadBtn.onclick = async () => {
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                const img = document.getElementById('buklikImg');
                const canvas = await html2canvas(img);
                const imgData = canvas.toDataURL('image/jpeg');
                pdf.addImage(imgData, 'JPEG', 10, 10, 40, 40);
                pdf.setFontSize(20);
                pdf.text('Волшебная книга', 60, 30);
                pdf.setFontSize(12);
                pdf.text(`Автор: ${childName}`, 60, 40);
                let y = 60;
                pdf.setFontSize(14);
                for (let i = 0; i < fullStory.length; i++) {
                    if (y > 270) { pdf.addPage(); y = 20; }
                    pdf.setFontSize(16);
                    pdf.text(`Глава ${i+1}`, 20, y);
                    y += 10;
                    const lines = pdf.splitTextToSize(fullStory[i], 170);
                    pdf.text(lines, 20, y);
                    y += lines.length * 7 + 15;
                }
                pdf.save(`${childName}_волшебная_сказка.pdf`);
                addMessage('Буклик', '📚 Книга сохранена! Покажи друзьям!');
            } catch (error) {
                console.error('Ошибка PDF:', error);
                alert('Не удалось создать PDF. Попробуй ещё раз.');
            }
        };
    })();
</script>
</body>
</html>
