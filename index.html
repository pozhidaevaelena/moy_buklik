<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Буклик — волшебный друг ✨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif; }
        body {
            background: linear-gradient(145deg, #7BC5AE 0%, #B8E1D9 50%, #E6C5A8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 248, 235, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 70px 70px 50px 50px;
            padding: 30px 25px 40px;
            box-shadow: 0 30px 50px rgba(92,55,20,0.3);
            border: 3px solid rgba(255,250,220,0.9);
            text-align: center;
        }
        h1 {
            font-size: 2.8rem;
            color: #3F2B1C;
            text-shadow: 4px 4px 0 #F9D77E;
            background: #FFF5E0;
            display: inline-block;
            padding: 12px 35px;
            border-radius: 90px;
            margin-bottom: 20px;
            border: 4px solid #FFCF9A;
        }
        
        /* ========== АНИМАЦИИ БУКЛИКА ========== */
        .character-img {
            max-width: 200px;
            border-radius: 50px;
            border: 5px solid #FFEAC1;
            filter: drop-shadow(0 15px 20px rgba(110,70,20,0.2));
            margin: 10px auto 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        /* Обычное покачивание */
        .character-idle {
            animation: float 4s ease-in-out infinite;
        }
        
        /* Радость — прыгает */
        .character-happy {
            animation: bounce 0.5s ease 3;
        }
        
        /* Удивление — наклон */
        .character-surprised {
            animation: shake 0.3s ease 2;
        }
        
        /* Слушает — наклон уха */
        .character-listening {
            animation: tilt 0.5s ease 2;
        }
        
        /* Грусть */
        .character-sad {
            animation: sadShake 1s ease infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        @keyframes bounce {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
            100% { transform: translateY(0px) scale(1); }
        }
        
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        
        @keyframes tilt {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }
        
        @keyframes sadShake {
            0% { transform: translateX(0px); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
            100% { transform: translateX(0px); }
        }
        
        .mission {
            background: rgba(255, 245, 215, 0.8);
            backdrop-filter: blur(2px);
            border-radius: 60px;
            padding: 18px 20px;
            margin: 0 10px 25px;
            border: 3px dashed #F1C78C;
            font-size: 1.3rem;
            color: #1F4E3D;
            line-height: 1.6;
        }
        .story-block {
            background: #FFF9E6;
            border-radius: 40px;
            padding: 25px;
            margin: 20px 0;
            border: 4px solid #FFB27F;
            font-size: 1.3rem;
            line-height: 1.6;
            color: #2B1404;
            box-shadow: inset 0 0 15px #FFEAC1;
            text-align: left;
        }
        .picture-block {
            background: #FFD9C0;
            border-radius: 30px;
            padding: 20px;
            margin: 15px 0;
            border: 4px dashed #FFB27F;
            display: none;
            text-align: center;
        }
        .picture-block img {
            max-width: 100%;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .chat {
            background: rgba(255,255,240,0.9);
            border-radius: 30px;
            padding: 20px;
            height: 250px;
            overflow-y: auto;
            border: 3px solid #FFCF9A;
            margin: 20px 0;
            text-align: left;
            font-size: 1rem;
        }
        .message { margin: 10px 0; padding: 8px 12px; border-radius: 20px; }
        .message.user { text-align: right; background: #FFE0B5; margin-left: 40px; }
        .message.bot { text-align: left; background: #FFF5E0; margin-right: 40px; }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            border-radius: 40px;
            border: 3px solid #FFCF9A;
            outline: none;
        }
        button {
            padding: 15px 25px;
            font-size: 1rem;
            border-radius: 40px;
            border: 3px solid #FFEAA2;
            background: #FFB27F;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
            box-shadow: 0 4px 0 #A65629;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 #A65629; }
        .mic { background: #A7D0CD; }
        .listening {
            background: #4CAF50;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); background: #4CAF50; }
            50% { transform: scale(1.05); background: #45a049; }
            100% { transform: scale(1); background: #4CAF50; }
        }
        .suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
            justify-content: center;
        }
        .suggestion-btn {
            background: #FFF0D9;
            border: 2px solid #FFB27F;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .suggestion-btn:hover { background: #FFB27F; color: white; }
        #download-btn {
            background: #D9B8C4;
            margin: 20px auto 0;
            display: none;
            padding: 15px 30px;
            border-radius: 60px;
            border: 4px solid #FFB27F;
            cursor: pointer;
            width: fit-content;
            font-weight: bold;
        }
        .reading-status {
            background: #FFE0B5;
            border-radius: 30px;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
            font-size: 0.9rem;
        }
        @media (max-width: 550px) {
            h1 { font-size: 2.2rem; }
            .mission { font-size: 1.1rem; }
            .story-block { font-size: 1.1rem; }
            button { padding: 12px 20px; font-size: 0.9rem; }
        }
        
        /* Звуковая подсказка */
        .sound-alert {
            background: #FFE0B5;
            border-radius: 20px;
            padding: 8px 15px;
            margin-bottom: 15px;
            font-size: 0.8rem;
            display: inline-block;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sound-alert" id="soundAlert">🔊 Нажми здесь, чтобы включить голос Буклика</div>
    <h1>✨ Привет, я Буклик ✨</h1>
    <div class="mission">
        Я помогаю придумывать волшебные истории,<br>
        читать вслух и рисовать картинки!
    </div>
    <img src="moy_buklik.jpg" alt="Буклик" class="character-img character-idle" id="buklikImg">

    <div class="story-block" id="storyBlock">📖 Здесь появится твоя история...</div>
    <div class="picture-block" id="pictureBlock">
        <div>🎨 Волшебная картинка создаётся...</div>
        <img id="pictureImg" src="" alt="Иллюстрация">
    </div>
    <div class="chat" id="chat"></div>
    
    <div class="suggestions" id="suggestions"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Напиши или нажми микрофон">
        <button id="sendBtn">📬 Отправить</button>
        <button id="micBtn" class="mic">🎤 Микрофон</button>
    </div>

    <div id="download-btn">📥 Скачать книгу</div>
</div>

<script>
    (function() {
        const API_URL = 'https://examples-beta-murex.vercel.app';

        const chatDiv = document.getElementById('chat');
        const storyBlock = document.getElementById('storyBlock');
        const pictureBlock = document.getElementById('pictureBlock');
        const pictureImg = document.getElementById('pictureImg');
        const buklikImg = document.getElementById('buklikImg');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const downloadBtn = document.getElementById('download-btn');
        const suggestionsDiv = document.getElementById('suggestions');
        const soundAlert = document.getElementById('soundAlert');

        let step = 0;
        let childName = '';
        let childGender = '';
        let hero = '', place = '', friend = '';
        let fullStory = [];
        let fullImages = [];
        let currentParagraph = 0;
        let expectedText = '';
        let recognition = null;
        let voiceEnabled = false;
        
        // Списки имён для определения пола
        const maleNames = ['александр', 'алексей', 'андрей', 'антон', 'артём', 'борис', 'вадим', 'валентин', 'валерий', 'василий', 'виктор', 'владимир', 'владислав', 'вячеслав', 'геннадий', 'георгий', 'герман', 'глеб', 'григорий', 'даниил', 'денис', 'дмитрий', 'евгений', 'егор', 'иван', 'игорь', 'илья', 'кирилл', 'константин', 'лев', 'леонид', 'максим', 'марк', 'матвей', 'михаил', 'никита', 'николай', 'олег', 'павел', 'пётр', 'платон', 'родион', 'роман', 'руслан', 'савва', 'святослав', 'семён', 'сергей', 'станислав', 'степан', 'тимофей', 'тимур', 'фёдор', 'филипп', 'юрий', 'яков', 'ярослав'];
        const femaleNames = ['александра', 'алина', 'алиса', 'алла', 'анастасия', 'ангелина', 'анна', 'антонина', 'валентина', 'валерия', 'варвара', 'вера', 'вероника', 'виктория', 'галина', 'дарина', 'дарья', 'диана', 'ева', 'евгения', 'екатерина', 'елена', 'елизавета', 'жанна', 'зинаида', 'зоя', 'инна', 'ирина', 'карина', 'кира', 'клавдия', 'ксения', 'лада', 'лариса', 'лидия', 'лилия', 'любовь', 'людмила', 'майя', 'маргарита', 'марина', 'мария', 'милена', 'надежда', 'настасья', 'наталья', 'нелли', 'нина', 'оксана', 'оливия', 'ольга', 'полина', 'раиса', 'рита', 'светлана', 'софия', 'софья', 'таисия', 'тамара', 'татьяна', 'ульяна', 'юлия'];
        
        // ========== АНИМАЦИИ БУКЛИКА ==========
        function animateBuklik(emotion) {
            buklikImg.classList.remove('character-idle', 'character-happy', 'character-surprised', 'character-listening', 'character-sad');
            
            switch(emotion) {
                case 'happy':
                    buklikImg.classList.add('character-happy');
                    setTimeout(() => buklikImg.classList.add('character-idle'), 500);
                    break;
                case 'surprised':
                    buklikImg.classList.add('character-surprised');
                    setTimeout(() => buklikImg.classList.add('character-idle'), 300);
                    break;
                case 'listening':
                    buklikImg.classList.add('character-listening');
                    setTimeout(() => buklikImg.classList.add('character-idle'), 500);
                    break;
                case 'sad':
                    buklikImg.classList.add('character-sad');
                    break;
                default:
                    buklikImg.classList.add('character-idle');
            }
        }
        
        // ========== ГОЛОС ==========
        function speakText(text) {
            if (!voiceEnabled || !text) return;
            
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1.2;
            
            const voices = window.speechSynthesis.getVoices();
            const ruVoice = voices.find(v => v.lang === 'ru-RU' && (v.name.includes('Google') || v.name.includes('Microsoft')));
            if (ruVoice) utterance.voice = ruVoice;
            
            window.speechSynthesis.speak(utterance);
            animateBuklik('listening');
        }
        
        // Включение голоса по клику
        function enableVoice() {
            if (!voiceEnabled) {
                voiceEnabled = true;
                soundAlert.textContent = '🔊 Голос Буклика включён!';
                soundAlert.style.background = '#4CAF50';
                soundAlert.style.color = 'white';
                speakText('Привет! Я Буклик, рад тебя слышать!');
                setTimeout(() => animateBuklik('happy'), 500);
            }
        }
        
        soundAlert.onclick = enableVoice;
        
        function addMessage(sender, text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'bot'}`;
            msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatDiv.appendChild(msg);
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            if (sender === 'Буклик' && !isUser) {
                speakText(text);
            }
        }
        
        function showSuggestions(options) {
            suggestionsDiv.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('span');
                btn.className = 'suggestion-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    userInput.value = opt;
                    sendBtn.click();
                };
                suggestionsDiv.appendChild(btn);
            });
        }
        
        function clearSuggestions() { suggestionsDiv.innerHTML = ''; }
        
        function detectGender(name) {
            const lowerName = name.toLowerCase();
            if (maleNames.includes(lowerName)) return 'boy';
            if (femaleNames.includes(lowerName)) return 'girl';
            return null;
        }
        
        async function callDeepSeek(prompt, system) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: prompt,
                        history: [],
                        system: system
                    })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.reply;
            } catch (error) {
                console.error('Ошибка:', error);
                return null;
            }
        }
        
        async function generateFirstParagraph() {
            addMessage('Буклик', '✨ Сейчас придумаю начало сказки...');
            animateBuklik('surprised');
            
            const heroText = hero;
            const prompt = `Напиши первый абзац волшебной сказки для ребёнка 7 лет.
                Герой: ${heroText}. 
                Место: ${place}. 
                Друг: ${friend}. 
                Напиши 3-4 предложения. Начни со слов "Жил-был" или "Жила-была".`;
            
            const paragraph = await callDeepSeek(prompt, 'Ты детский писатель. Пиши красиво и волшебно.');
            
            if (paragraph) {
                fullStory.push(paragraph);
                storyBlock.textContent = paragraph;
                addMessage('Буклик', paragraph);
                animateBuklik('happy');
                return true;
            } else {
                const fallback = `Жил-был ${heroText} в ${place}. Однажды ${heroText} встретил ${friend}. И началось у них волшебное приключение!`;
                fullStory.push(fallback);
                storyBlock.textContent = fallback;
                addMessage('Буклик', fallback);
                return true;
            }
        }
        
        async function generateNextParagraph(userIdea) {
            addMessage('Буклик', '✨ Сейчас придумаю продолжение...');
            animateBuklik('surprised');
            
            const heroText = hero;
            const prompt = `Продолжи сказку про ${heroText} и ${friend}. 
                Ребёнок придумал: "${userIdea}". 
                Напиши следующий абзац (3-4 предложения). Развивай сюжет.`;
            
            const paragraph = await callDeepSeek(prompt, 'Ты детский писатель. Продолжи сказку.');
            
            if (paragraph) {
                fullStory.push(paragraph);
                storyBlock.textContent = paragraph;
                addMessage('Буклик', paragraph);
                animateBuklik('happy');
                return true;
            } else {
                const fallback = `И отправились ${heroText} и ${friend} дальше, навстречу новым чудесам!`;
                fullStory.push(fallback);
                storyBlock.textContent = fallback;
                addMessage('Буклик', fallback);
                return true;
            }
        }
        
        async function generateFinalParagraph() {
            addMessage('Буклик', '✨ Придумываю красивый финал...');
            animateBuklik('surprised');
            
            const heroText = hero;
            const prompt = `Напиши счастливый конец сказки про ${heroText} и ${friend}. 
                Они возвращаются домой, всё хорошо. 3-4 предложения, тепло, волшебно.
                Закончи словами "И жили они долго и счастливо".`;
            
            const paragraph = await callDeepSeek(prompt, 'Ты детский писатель. Напиши тёплый финал.');
            
            if (paragraph) {
                fullStory.push(paragraph);
                storyBlock.textContent = paragraph;
                addMessage('Буклик', paragraph);
                animateBuklik('happy');
                return true;
            } else {
                const fallback = `И вернулись ${heroText} и ${friend} домой. Все были счастливы. И жили они долго и счастливо!`;
                fullStory.push(fallback);
                storyBlock.textContent = fallback;
                addMessage('Буклик', fallback);
                return true;
            }
        }
        
        async function generatePicture(prompt) {
            pictureBlock.style.display = 'block';
            pictureImg.src = '';
            const imgDiv = pictureBlock.querySelector('div');
            if (imgDiv) imgDiv.innerText = '🎨 Волшебная картинка создаётся...';
            
            try {
                const encodedPrompt = encodeURIComponent(prompt.slice(0, 100));
                const response = await fetch(`${API_URL}/generate-image?prompt=${encodedPrompt}`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    pictureImg.src = url;
                    fullImages.push(url);
                    if (imgDiv) imgDiv.innerText = '✨ Вот картинка к твоей истории!';
                    animateBuklik('happy');
                } else {
                    throw new Error('Ошибка');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                if (imgDiv) imgDiv.innerText = '😔 Картинка не загрузилась, но ты молодец!';
            }
        }
        
        // ========== ПРОВЕРКА ЧТЕНИЯ ==========
        function startListening() {
            if (!recognition) {
                if (!('webkitSpeechRecognition' in window)) {
                    addMessage('Буклик', 'Твой браузер не поддерживает микрофон. Попробуй Chrome!');
                    return;
                }
                recognition = new webkitSpeechRecognition();
                recognition.lang = 'ru-RU';
                recognition.continuous = false;
                recognition.interimResults = false;
            }
            
            micBtn.classList.add('listening');
            micBtn.textContent = '🎤 Слушаю...';
            addMessage('Буклик', '🎙️ Слушаю тебя! Прочитай этот абзац вслух.');
            animateBuklik('listening');
            
            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤 Микрофон';
                addMessage('Ты', spokenText, true);
                checkReading(spokenText);
            };
            
            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤 Микрофон';
                addMessage('Буклик', '😊 Не расслышал. Попробуй ещё раз, нажми на микрофон и читай громче!');
                animateBuklik('sad');
            };
            
            recognition.start();
        }
        
        function checkReading(spokenText) {
            const cleanExpected = expectedText.toLowerCase().replace(/[^\w\s]/g, '');
            const cleanSpoken = spokenText.toLowerCase().replace(/[^\w\s]/g, '');
            
            const expectedWords = cleanExpected.split(/\s+/);
            const spokenWords = cleanSpoken.split(/\s+/);
            let matches = 0;
            for (let word of spokenWords) {
                if (expectedWords.some(w => w.includes(word) || word.includes(w))) {
                    matches++;
                }
            }
            const matchPercent = matches / expectedWords.length;
            
            if (matchPercent > 0.3 || cleanSpoken.length > cleanExpected.length * 0.3) {
                addMessage('Буклик', '🎉 Отлично! Ты замечательно прочитал(а)! Молодец!');
                animateBuklik('happy');
                
                const imgPrompt = expectedText.slice(0, 80) + ", волшебная сказка, иллюстрация для детей";
                generatePicture(imgPrompt);
                
                setTimeout(() => {
                    currentParagraph++;
                    if (currentParagraph < fullStory.length) {
                        expectedText = fullStory[currentParagraph];
                        storyBlock.textContent = expectedText;
                        addMessage('Буклик', '📖 Вот следующий абзац. Прочитай его вслух!');
                        addMessage('Буклик', expectedText);
                    } else {
                        addMessage('Буклик', '📚 Ура! Ты прочитал(а) всю сказку! Хочешь скачать книгу?');
                        downloadBtn.style.display = 'inline-block';
                        step = 10;
                    }
                }, 2000);
            } else {
                addMessage('Буклик', '😊 Почти получилось! Давай попробуем ещё раз. Нажми на микрофон и прочитай внимательно.');
                animateBuklik('sad');
            }
        }
        
        // ========== ОСНОВНАЯ ЛОГИКА ==========
        addMessage('Буклик', 'Привет! Я Буклик 🤗');
        addMessage('Буклик', 'Как тебя зовут?');
        
        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            addMessage('Ты', text, true);
            clearSuggestions();
            
            try {
                if (step === 0) {
                    childName = text;
                    const detected = detectGender(childName);
                    if (detected) {
                        childGender = detected;
                        addMessage('Буклик', `Приятно познакомиться, ${childName}!`);
                        addMessage('Буклик', 'Кто будет главным героем сказки?');
                        showSuggestions(['я', 'фея', 'дракон', 'принцесса', 'котёнок', 'волшебник', 'единорог']);
                        step = 2;
                    } else {
                        addMessage('Буклик', `Приятно познакомиться, ${childName}! Ты мальчик или девочка?`);
                        showSuggestions(['мальчик', 'девочка']);
                        step = 1;
                    }
                }
                else if (step === 1) {
                    childGender = text.includes('мальчик') ? 'boy' : 'girl';
                    addMessage('Буклик', 'Кто будет главным героем сказки?');
                    showSuggestions(['я', 'фея', 'дракон', 'принцесса', 'котёнок', 'волшебник', 'единорог']);
                    step = 2;
                }
                else if (step === 2) {
                    const lower = text.toLowerCase().trim();
                    if (lower === 'я' || lower === 'я сама' || lower === 'я сам') {
                        hero = childGender === 'boy' ? `мальчик ${childName}` : `девочка ${childName}`;
                    } else {
                        hero = text;
                    }
                    addMessage('Буклик', 'Где происходит действие?');
                    showSuggestions(['в волшебном лесу', 'в замке', 'в космосе', 'на острове', 'под водой', 'в облаках']);
                    step = 3;
                }
                else if (step === 3) {
                    place = text;
                    addMessage('Буклик', 'Кто друг героя?');
                    showSuggestions(['лисёнок', 'дракончик', 'фея', 'говорящий кот', 'мудрая сова', 'весёлый робот']);
                    step = 4;
                }
                else if (step === 4) {
                    friend = text;
                    await generateFirstParagraph();
                    expectedText = fullStory[0];
                    currentParagraph = 0;
                    addMessage('Буклик', '🎤 Теперь прочитай этот абзац вслух! Нажми на синюю кнопку с микрофоном.');
                    step = 5;
                }
                else if (step === 5) {
                    addMessage('Буклик', 'Нажми на кнопку с микрофоном 🎤 и прочитай текст вслух!');
                }
                else if (step === 6) {
                    await generateNextParagraph(text);
                    expectedText = fullStory[fullStory.length - 1];
                    addMessage('Буклик', '🎤 Прочитай этот абзац вслух!');
                    step = 5;
                }
                else if (step === 7) {
                    if (text.includes('продолжи') || text.toLowerCase().includes('да')) {
                        addMessage('Буклик', '✨ Что будет дальше в сказке? Придумай свой вариант или выбери.');
                        showSuggestions(['нашли клад', 'встретили волшебника', 'спасли друга', 'полетели путешествовать', 'придумаю сам(а)']);
                        step = 6;
                    } else {
                        await generateFinalParagraph();
                        expectedText = fullStory[fullStory.length - 1];
                        addMessage('Буклик', '🎤 Прочитай финал вслух!');
                        step = 5;
                    }
                }
                else if (step === 10) {
                    if (text.includes('да') || text.includes('хочу')) {
                        addMessage('Буклик', 'Отлично! Нажми на кнопку "Скачать книгу" внизу.');
                    } else {
                        addMessage('Буклик', 'Хорошо! В любое время можешь скачать книгу. Приходи ещё!');
                    }
                }
            } catch (error) {
                console.error('Ошибка:', error);
                addMessage('Буклик', 'Что-то пошло не так. Давай попробуем ещё раз.');
            }
        };
        
        // Микрофон
        micBtn.onclick = () => {
            if ((step === 5 || step === 6 || step === 7 || step === 10) && expectedText) {
                startListening();
            } else {
                if ('webkitSpeechRecognition' in window) {
                    const rec = new webkitSpeechRecognition();
                    rec.lang = 'ru-RU';
                    rec.onresult = (e) => {
                        userInput.value = e.results[0][0].transcript;
                        sendBtn.click();
                    };
                    rec.start();
                }
            }
        };
        
        // Скачивание PDF
        downloadBtn.onclick = async () => {
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                const canvas = await html2canvas(buklikImg);
                const imgData = canvas.toDataURL('image/jpeg');
                pdf.addImage(imgData, 'JPEG', 10, 10, 40, 40);
                pdf.setFontSize(20);
                pdf.text('Волшебная книга', 60, 30);
                pdf.setFontSize(12);
                pdf.text(`Автор: ${childName}`, 60, 40);
                let y = 60;
                pdf.setFontSize(14);
                for (let i = 0; i < fullStory.length; i++) {
                    if (y > 270) { pdf.addPage(); y = 20; }
                    pdf.setFontSize(16);
                    pdf.text(`Глава ${i+1}`, 20, y);
                    y += 10;
                    const lines = pdf.splitTextToSize(fullStory[i], 170);
                    pdf.text(lines, 20, y);
                    y += lines.length * 7 + 15;
                    
                    if (fullImages[i]) {
                        if (y > 250) { pdf.addPage(); y = 20; }
                        try {
                            const imgResponse = await fetch(fullImages[i]);
                            const imgBlob = await imgResponse.blob();
                            const reader = new FileReader();
                            reader.onloadend = function() {
                                pdf.addImage(reader.result, 'JPEG', 60, y, 80, 80);
                            };
                            reader.readAsDataURL(imgBlob);
                        } catch(e) {}
                        y += 90;
                    }
                }
                pdf.save(`волшебная_сказка_${childName}.pdf`);
                addMessage('Буклик', '📚 Книга сохранена!');
            } catch (error) {
                alert('Не удалось создать PDF');
            }
        };
    })();
</script>
</body>
</html>
