<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Буклик - волшебный друг</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(145deg, #7BC5AE 0%, #B8E1D9 50%, #E6C5A8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 248, 235, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 70px 70px 50px 50px;
            padding: 30px 25px 40px;
            box-shadow: 0 30px 50px rgba(92,55,20,0.3);
            border: 3px solid rgba(255,250,220,0.9);
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #3F2B1C;
            text-shadow: 4px 4px 0 #F9D77E;
            background: #FFF5E0;
            display: inline-block;
            padding: 12px 35px;
            border-radius: 90px;
            margin-bottom: 20px;
            border: 4px solid #FFCF9A;
        }
        .mission {
            background: rgba(255, 245, 215, 0.8);
            border-radius: 60px;
            padding: 18px 20px;
            margin: 0 10px 25px;
            border: 3px dashed #F1C78C;
            font-size: 1.2rem;
            color: #1F4E3D;
        }
        .character-img {
            max-width: 150px;
            border-radius: 50px;
            border: 5px solid #FFEAC1;
            margin: 10px auto 20px;
        }
        .story-block {
            background: #FFF9E6;
            border-radius: 40px;
            padding: 25px;
            margin: 20px 0;
            border: 4px solid #FFB27F;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #2B1404;
            text-align: left;
        }
        .picture-block {
            background: #FFD9C0;
            border-radius: 30px;
            padding: 20px;
            margin: 15px 0;
            border: 4px dashed #FFB27F;
            display: none;
            text-align: center;
        }
        .picture-block img {
            max-width: 100%;
            border-radius: 30px;
        }
        .chat {
            background: rgba(255,255,240,0.9);
            border-radius: 30px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            border: 3px solid #FFCF9A;
            margin: 20px 0;
            text-align: left;
            font-size: 1rem;
        }
        .message {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 20px;
        }
        .message.user {
            text-align: right;
            background: #FFE0B5;
            margin-left: 40px;
        }
        .message.bot {
            text-align: left;
            background: #FFF5E0;
            margin-right: 40px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            border-radius: 40px;
            border: 3px solid #FFCF9A;
            outline: none;
        }
        button {
            padding: 15px 25px;
            font-size: 1rem;
            border-radius: 40px;
            border: none;
            background: #FFB27F;
            cursor: pointer;
            font-weight: bold;
        }
        .mic { background: #A7D0CD; }
        .suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
            justify-content: center;
        }
        .suggestion-btn {
            background: #FFF0D9;
            border: 2px solid #FFB27F;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .suggestion-btn:hover { background: #FFB27F; color: white; }
        #download-btn {
            background: #D9B8C4;
            margin: 20px auto 0;
            display: none;
            padding: 15px 30px;
            border-radius: 60px;
            cursor: pointer;
            width: fit-content;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>Привет, я Буклик</h1>
    <div class="mission">
        Я помогаю придумывать волшебные истории, рисовать картинки и читать вслух.
    </div>
    <img src="moy_buklik.jpg" alt="Буклик" class="character-img" id="buklikImg">

    <div class="story-block" id="storyBlock">Здесь появится твоя история...</div>
    <div class="picture-block" id="pictureBlock">
        <div>Волшебная картинка создаётся...</div>
        <img id="pictureImg" src="" alt="Иллюстрация">
    </div>
    <div class="chat" id="chat"></div>
    
    <div class="suggestions" id="suggestions"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Напиши или нажми микрофон">
        <button id="sendBtn">Отправить</button>
        <button id="micBtn" class="mic">Микрофон</button>
    </div>

    <div id="download-btn">Скачать книгу</div>
</div>

<script>
    (function() {
        const API_URL = 'https://examples-beta-murex.vercel.app';

        const chat = document.getElementById('chat');
        const storyBlock = document.getElementById('storyBlock');
        const pictureBlock = document.getElementById('pictureBlock');
        const pictureImg = document.getElementById('pictureImg');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const downloadBtn = document.getElementById('download-btn');
        const suggestionsDiv = document.getElementById('suggestions');

        let step = 0;
        let childName = '';
        let childGender = '';
        let hero = '';
        let place = '';
        let friend = '';
        let magicItem = '';
        let fullStory = [];
        let fullImagePrompts = [];
        let currentParagraph = 0;

        // Голос
        let voiceEnabled = true;
        let speechSynthesis = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = speechSynthesis.getVoices();
        }
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speakText(text) {
            if (!voiceEnabled) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            const ruVoice = voices.find(v => v.lang === 'ru-RU');
            if (ruVoice) utterance.voice = ruVoice;
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function addMessage(text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'bot'}`;
            msg.textContent = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            if (!isUser) speakText(text);
        }

        function showSuggestions(options) {
            suggestionsDiv.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('span');
                btn.className = 'suggestion-btn';
                btn.textContent = opt;
                btn.onclick = () => {
                    userInput.value = opt;
                    sendBtn.click();
                };
                suggestionsDiv.appendChild(btn);
            });
        }

        function clearSuggestions() { suggestionsDiv.innerHTML = ''; }

        async function callSimpleGPT(prompt, system) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: prompt,
                        history: [],
                        system: system
                    })
                });
                if (!response.ok) throw new Error('Ошибка сервера');
                const data = await response.json();
                return data.reply;
            } catch (error) {
                console.error('Ошибка:', error);
                return null;
            }
        }

        async function generateStoryParagraph(heroName, placeName, friendName, userIdea = '') {
            let prompt = `Напиши один абзац волшебной сказки для ребёнка 7 лет. Герой: ${heroName}. Место: ${placeName}. Друг: ${friendName}.`;
            if (userIdea) prompt += ` Ребёнок придумал: ${userIdea}.`;
            prompt += ` Напиши 3-4 предложения. Также в конце напиши "ПРОМТ КАРТИНКИ:" и описание для картинки (5-7 слов).`;
            
            const system = "Ты детский писатель. Пиши добрые, волшебные истории. Не используй звёздочки и markdown. Отвечай только текстом.";
            
            const result = await callSimpleGPT(prompt, system);
            if (!result) return null;
            
            let storyText = result;
            let imagePrompt = "волшебная сказка, дети";
            
            const promptMatch = result.match(/ПРОМТ КАРТИНКИ:\s*(.+)/i);
            if (promptMatch) {
                imagePrompt = promptMatch[1].trim();
                storyText = result.replace(/ПРОМТ КАРТИНКИ:.+/i, '').trim();
            }
            
            return { story_text: storyText, image_prompt: imagePrompt };
        }

        async function generatePicture(prompt) {
            pictureBlock.style.display = 'block';
            pictureImg.src = '';
            const imgDiv = pictureBlock.querySelector('div');
            if (imgDiv) imgDiv.textContent = 'Волшебная картинка создаётся...';

            try {
                const encodedPrompt = encodeURIComponent(prompt.slice(0, 150));
                const response = await fetch(`${API_URL}/generate-image?prompt=${encodedPrompt}`);
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    pictureImg.src = url;
                    if (imgDiv) imgDiv.textContent = 'Вот картинка к твоей истории';
                } else {
                    throw new Error('Ошибка');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                if (imgDiv) imgDiv.textContent = 'Картинка не загрузилась, но сказка продолжается';
            }
        }

        // Запуск
        addMessage('Привет! Я Буклик');
        addMessage('Как тебя зовут?');

        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            addMessage(text, true);
            clearSuggestions();

            try {
                if (step === 0) {
                    childName = text;
                    addMessage(`Приятно познакомиться, ${childName}`);
                    addMessage('Ты мальчик или девочка?');
                    showSuggestions(['мальчик', 'девочка']);
                    step = 1;
                }
                else if (step === 1) {
                    childGender = text.includes('мальчик') ? 'мальчик' : 'девочка';
                    addMessage(`Хорошо! Кто будет главным героем сказки? Ты можешь выбрать или придумать своего`);
                    showSuggestions(['волшебник', 'принцесса', 'дракон', 'фея', 'котёнок', 'единорог', 'пират', 'робот']);
                    step = 2;
                }
                else if (step === 2) {
                    hero = text;
                    addMessage(`Отлично! Где будет происходить действие?`);
                    showSuggestions(['волшебный лес', 'старый замок', 'космос', 'остров сокровищ', 'подводное царство', 'город в облаках', 'школа магии']);
                    step = 3;
                }
                else if (step === 3) {
                    place = text;
                    addMessage(`Кто будет другом героя?`);
                    showSuggestions(['верный пёс', 'говорящий кот', 'маленький дракончик', 'фея-крестная', 'волшебный лисёнок', 'мудрая сова', 'весёлый робот']);
                    step = 4;
                }
                else if (step === 4) {
                    friend = text;
                    addMessage(`Есть ли у героя волшебный предмет? (Можешь написать "нет")`);
                    showSuggestions(['волшебная палочка', 'ковёр-самолёт', 'шапка-невидимка', 'меч-кладенец', 'живая вода', 'нет']);
                    step = 5;
                }
                else if (step === 5) {
                    magicItem = text;
                    if (magicItem.toLowerCase() === 'нет') magicItem = '';
                    
                    addMessage(`Сейчас придумаю начало сказки!`);
                    
                    let heroText = childGender === 'мальчик' ? `мальчик ${hero}` : `девочка ${hero}`;
                    if (hero === 'я' || hero === 'меня') heroText = childGender === 'мальчик' ? `мальчик ${childName}` : `девочка ${childName}`;
                    
                    const result = await generateStoryParagraph(heroText, place, friend, '');
                    
                    if (result) {
                        fullStory = [result.story_text];
                        fullImagePrompts = [result.image_prompt];
                        storyBlock.textContent = result.story_text;
                        addMessage(result.story_text);
                        addMessage(`Вот начало твоей сказки! Прочитай вслух, когда будешь готова`);
                        step = 6;
                    } else {
                        addMessage(`Жили-были ${heroText} в ${place}. И был у него друг ${friend}. Однажды случилось чудо...`);
                        step = 6;
                    }
                }
                else if (step === 6) {
                    addMessage(`Замечательно! Сейчас нарисую картинку`);
                    
                    if (fullImagePrompts.length > 0) {
                        await generatePicture(fullImagePrompts[0]);
                    }
                    
                    addMessage(`Что будет дальше в сказке? Придумай или выбери`);
                    showSuggestions(['нашли волшебный клад', 'встретили злого колдуна', 'спасли друга из беды', 'полетели в далёкую страну', 'научились новому заклинанию', 'помогли лесным жителям']);
                    step = 7;
                }
                else if (step === 7) {
                    addMessage(`Сейчас придумаю продолжение...`);
                    
                    let heroText = childGender === 'мальчик' ? `мальчик ${hero}` : `девочка ${hero}`;
                    if (hero === 'я' || hero === 'меня') heroText = childGender === 'мальчик' ? `мальчик ${childName}` : `девочка ${childName}`;
                    
                    const result = await generateStoryParagraph(heroText, place, friend, text);
                    
                    if (result) {
                        fullStory.push(result.story_text);
                        fullImagePrompts.push(result.image_prompt);
                        storyBlock.textContent = result.story_text;
                        addMessage(result.story_text);
                        await generatePicture(result.image_prompt);
                        
                        addMessage(`Хочешь продолжить сказку или закончим?`);
                        showSuggestions(['продолжить', 'закончить сказку']);
                        step = 8;
                    } else {
                        addMessage(`И отправились они в новое приключение...`);
                        step = 8;
                    }
                }
                else if (step === 8) {
                    if (text.toLowerCase().includes('продолжи')) {
                        addMessage(`Отлично! Что случится дальше?`);
                        showSuggestions(['новое приключение', 'встреча с другом', 'волшебное превращение', 'спасение королевства']);
                        step = 7;
                    } else {
                        addMessage(`Вот и подошла к концу наша сказка! Ты настоящий сказочник. Сказку можно скачать в формате PDF`);
                        addMessage(`Спасибо за приключение! Приходи ещё, придумаем новую историю`);
                        downloadBtn.style.display = 'inline-block';
                        step = 9;
                    }
                }
            } catch (error) {
                console.error('Ошибка:', error);
                addMessage('Что-то пошло не так. Давай попробуем ещё раз');
            }
        };

        // Микрофон
        if ('webkitSpeechRecognition' in window) {
            const rec = new webkitSpeechRecognition();
            rec.lang = 'ru-RU';
            rec.continuous = false;
            rec.interimResults = false;
            rec.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                sendBtn.click();
            };
            rec.onerror = () => addMessage('Не расслышал, попробуй ещё раз');
            micBtn.onclick = () => rec.start();
        } else {
            micBtn.style.display = 'none';
        }

        downloadBtn.onclick = async () => {
            alert('Скачивание книги появится в следующей версии');
        };
    })();
</script>
</body>
</html>
